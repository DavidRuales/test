<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Regalis | Archivo Iluminado & Shader Áureo</title>
    
    <!-- Tipografías Clásicas y Técnicas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Import Map para que tus módulos ES6 ('three' y 'three/examples/jsm/...') funcionen nativamente en GitHub Pages -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <style>
        /* ==========================================================================
           MÓDULO 1: TOKENS DE PIGMENTOS HISTÓRICOS & PAN DE ORO
           ========================================================================== */
        :root {
            --vellum-base: #f3ead8;
            --vellum-shadow: #dfd0b3;
            --ink-iron: #1b1714;
            --ink-faded: #5a4f44;
            --lapis-lazuli: #183a6d;
            --lapis-deep: #0f2547;
            --vermilion-red: #9e2a2b;
            --malachite-green: #235347;
            --gold-leaf: #c59b27;
            --gold-bright: #ebd07a;
            --glass-vellum: rgba(243, 234, 216, 0.78);
            
            --font-display: 'Cinzel Decorative', serif;
            --font-editorial: 'Cormorant Garamond', serif;
            --font-telemetry: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--vellum-base);
            color: var(--ink-iron);
            font-family: var(--font-editorial);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            background-image: 
                radial-gradient(circle at 50% 45%, rgba(255, 252, 245, 0.6) 0%, rgba(223, 208, 179, 0.85) 100%),
                repeating-linear-gradient(45deg, rgba(27,23,20,0.015) 0px, rgba(27,23,20,0.015) 1px, transparent 1px, transparent 4px);
        }

        /* ==========================================================================
           MÓDULO 2: MARCO DE MANUSCRITO ILUMINADO Y ASTROLABIO DE FONDO
           ========================================================================== */
        .illuminated-frame {
            position: fixed;
            inset: 14px;
            border: 2px solid var(--gold-leaf);
            pointer-events: none;
            z-index: 20;
            box-shadow: inset 0 0 0 4px var(--vellum-base), inset 0 0 0 5px var(--vermilion-red);
        }

        .corner-ornament {
            position: absolute;
            width: 28px;
            height: 28px;
            border: 2px solid var(--lapis-lazuli);
            background: var(--vellum-base);
            transform: rotate(45deg);
        }
        .corner-tl { top: -14px; left: -14px; }
        .corner-tr { top: -14px; right: -14px; }
        .corner-bl { bottom: -14px; left: -14px; }
        .corner-br { bottom: -14px; right: -14px; }

        .astrolabe-backdrop {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 68vh;
            height: 68vh;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(197, 155, 39, 0.45);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: spinSlow 90s linear infinite;
        }
        .astrolabe-backdrop::before {
            content: '';
            position: absolute;
            inset: 24px;
            border: 1px solid rgba(24, 58, 109, 0.18);
            border-radius: 50%;
        }

        @keyframes spinSlow {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ==========================================================================
           MÓDULO 3: LIENZO WEBGL (THREE.JS + POST-PROCESADO BLOOM)
           ========================================================================== */
        #webgl-container {
            position: fixed;
            inset: 0;
            z-index: 5;
            cursor: grab;
        }
        #webgl-container:active {
            cursor: grabbing;
        }

        /* ==========================================================================
           MÓDULO 4: CABECERA REAL, FICHA CON LETRA CAPITAL Y CONTROLES
           ========================================================================== */
        .royal-header {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 15;
            pointer-events: none;
        }

        .wax-seal {
            display: inline-block;
            background: var(--vermilion-red);
            color: var(--vellum-base);
            font-family: var(--font-telemetry);
            font-size: 0.65rem;
            letter-spacing: 3px;
            padding: 4px 12px;
            border: 1px solid var(--gold-bright);
            box-shadow: 0 2px 8px rgba(158, 42, 43, 0.35);
            margin-bottom: 8px;
        }

        .royal-header h1 {
            font-family: var(--font-display);
            font-size: clamp(1.3rem, 2.5vw, 2.1rem);
            color: var(--lapis-deep);
            letter-spacing: 4px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }

        /* Tarjeta de Códice */
        .codex-card {
            position: fixed;
            left: 38px;
            bottom: 92px;
            width: min(360px, calc(100vw - 76px));
            background: var(--glass-vellum);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--gold-leaf);
            border-left: 4px solid var(--lapis-lazuli);
            padding: 20px;
            z-index: 15;
            box-shadow: 0 12px 32px rgba(27, 23, 20, 0.12);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .codex-card.hidden {
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
        }

        .drop-cap {
            float: left;
            font-family: var(--font-display);
            font-size: 3.1rem;
            line-height: 0.85;
            padding: 6px 10px 4px 8px;
            margin-right: 10px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--lapis-lazuli), var(--lapis-deep));
            color: var(--gold-bright);
            border: 1.5px solid var(--gold-leaf);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
        }

        .codex-card p {
            font-size: 1.05rem;
            line-height: 1.45;
            color: var(--ink-iron);
        }

        .telemetry-strip {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(197, 155, 39, 0.4);
            display: flex;
            justify-content: space-between;
            font-family: var(--font-telemetry);
            font-size: 0.7rem;
            color: var(--malachite-green);
        }

        /* Barra Inferior de Instrumentos */
        .control-dock {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 15;
            background: var(--glass-vellum);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border: 1px solid var(--gold-leaf);
            box-shadow: 0 6px 20px rgba(27, 23, 20, 0.15);
        }

        .royal-btn {
            background: transparent;
            border: 1px solid rgba(24, 58, 109, 0.35);
            color: var(--lapis-deep);
            font-family: var(--font-telemetry);
            font-size: 0.72rem;
            letter-spacing: 1px;
            padding: 7px 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .royal-btn:hover, .royal-btn.active {
            background: var(--lapis-lazuli);
            color: var(--gold-bright);
            border-color: var(--gold-leaf);
        }

        /* Indicador de Carga */
        #loader-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-telemetry);
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--lapis-deep);
            background: var(--vellum-base);
            padding: 12px 24px;
            border: 1px solid var(--gold-leaf);
            z-index: 30;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- Marco Ornamental -->
    <div class="illuminated-frame">
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>
    </div>

    <div class="astrolabe-backdrop"></div>
    <div id="loader-banner">FORJANDO ORO DE 24K...</div>

    <!-- Cabecera Imperial -->
    <header class="royal-header">
        <div class="wax-seal">FOLIO IV • ARCHIVO ÁUREO</div>
        <h1>CODEX REGALIS</h1>
    </header>

    <!-- Contenedor Three.js -->
    <div id="webgl-container"></div>

    <!-- Ficha Descriptiva Iluminada -->
    <aside class="codex-card" id="codex-card">
        <p><span class="drop-cap">R</span>eliquia dinástica forjada bajo geometría sagrada y renderizada mediante micro-facetas especulares de oro puro. Gira la pieza para observar los destellos incandescentes sobre sus crestas pulidas.</p>
        <div class="telemetry-strip">
            <span id="telemetry-angle">AZIMUT: 000°</span>
            <span>SHADER: 24K GLINT PBR</span>
        </div>
    </aside>

    <!-- Barra de Controles -->
    <nav class="control-dock">
        <button class="royal-btn active" data-cam="imperial">Vista Imperial</button>
        <button class="royal-btn" data-cam="detalle">Detalle Áureo</button>
        <button class="royal-btn" data-cam="cenital">Cenital</button>
        <button class="royal-btn" id="btn-rotate">Auto-Giro: ON</button>
        <button class="royal-btn" id="btn-hud">Ocultar Códice</button>
    </nav>

    <!-- ==========================================================================
         MÓDULO 5: MOTOR THREE.JS CON TUS DOS SCRIPTS INTEGRADOS
         ========================================================================== -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/examples/jsm/loaders/RGBELoader.js';
        import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';

        // 1. IMPORTACIÓN DE TU SHADER PERSONALIZADO DE ORO REAL
        // Asegúrate de que este archivo exista en tu repositorio con este nombre exacto:
        import { crearMaterialOroReal } from './crearMaterialOroReal.js';

        // Configuración de Rutas de tu Repositorio GitHub
        const CONFIG = {
            modeloGLB: './reliquia_real.glb',     // Cambia al nombre de tu .glb
            entornoHDR: './royal_studio_4k.hdr'   // Cambia al nombre de tu .hdr (tiene respaldo automático si no existe)
        };

        // Inicialización de Escena y Cámara
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 4.2);

        // Renderizador con alfa transparente para que se vea el pergamino iluminado detrás
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // Controles de Órbita Suaves
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.target.set(0, 1.1, 0);

        // Iluminación de Respaldo (por si aún no subes el archivo .hdr)
        const ambientLight = new THREE.AmbientLight(0xfff4d6, 0.6);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xfffaed, 2.5);
        keyLight.position.set(3, 5, 4);
        scene.add(keyLight);

        // 2. CARGA DE ENTORNO HDRI (DE TU SEGUNDO SCRIPT)
        new RGBELoader().load(
            CONFIG.entornoHDR,
            (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
            },
            undefined,
            () => {
                console.info('Aviso: No se encontró el archivo .hdr; usando iluminación direccional de estudio.');
            }
        );

        // 3. INSTANCIA DE TU MATERIAL DE ORO DE 24K Y CARGA DEL GLB
        const oroMaterial = crearMaterialOroReal();
        const loader = new GLTFLoader();
        const loaderBanner = document.getElementById('loader-banner');

        loader.load(
            CONFIG.modeloGLB,
            (gltf) => {
                gltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        // Heredamos los mapas de detalle originales del GLB si existen
                        if (child.material.normalMap) oroMaterial.normalMap = child.material.normalMap;
                        if (child.material.roughnessMap) oroMaterial.roughnessMap = child.material.roughnessMap;
                        
                        child.material = oroMaterial;
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(gltf.scene);
                loaderBanner.style.opacity = '0';
                setTimeout(() => loaderBanner.remove(), 500);
            },
            undefined,
            (error) => {
                console.warn('No se encontró el .glb, generando reliquia de muestra con tu shader de oro:', error);
                // Geometría de demostración si aún no subes el .glb
                const demoMesh = new THREE.Mesh(new THREE.TorusKnotGeometry(0.75, 0.24, 180, 32), oroMaterial);
                demoMesh.position.y = 1.2;
                scene.add(demoMesh);
                loaderBanner.style.opacity = '0';
                setTimeout(() => loaderBanner.remove(), 500);
            }
        );

        // 4. POST-PROCESADO SELECTIVO (UNREAL BLOOM PASS DE TU SEGUNDO SCRIPT)
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        renderPass.clearAlpha = 0; // Mantiene el fondo transparente sobre la vitela
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.45, // Fuerza del resplandor
            0.6,  // Radio de dispersión
            1.15  // Umbral HDR: solo brillan los destellos > 1.15 de tu shader
        );
        composer.addPass(bloomPass);

        // 5. INTERACTIVIDAD DE CÁMARAS Y HUD
        const cameraPresets = {
            imperial: { pos: [0, 1.8, 4.2], target: [0, 1.1, 0] },
            detalle:  { pos: [1.1, 1.5, 1.9], target: [0, 1.3, 0] },
            cenital:  { pos: [0, 4.2, 0.5], target: [0, 1.0, 0] }
        };

        document.querySelectorAll('[data-cam]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const preset = cameraPresets[e.target.dataset.cam];
                camera.position.set(...preset.pos);
                controls.target.set(...preset.target);
            });
        });

        const btnRotate = document.getElementById('btn-rotate');
        btnRotate.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
            btnRotate.textContent = `Auto-Giro: ${controls.autoRotate ? 'ON' : 'OFF'}`;
        });

        const btnHud = document.getElementById('btn-hud');
        const codexCard = document.getElementById('codex-card');
        btnHud.addEventListener('click', () => {
            codexCard.classList.toggle('hidden');
            btnHud.textContent = codexCard.classList.contains('hidden') ? 'Mostrar Códice' : 'Ocultar Códice';
        });

        // Ajuste responsivo al redimensionar ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. LOOP DE ANIMACIÓN PRINCIPAL
        const telemetryAngle = document.getElementById('telemetry-angle');

        function animate(time) {
            requestAnimationFrame(animate);
            
            // Actualizamos el tiempo en los uniforms de tu shader
            if (oroMaterial.userData.shaderUniforms) {
                oroMaterial.userData.shaderUniforms.uTime.value = time * 0.001;
            }

            controls.update();

            // Actualizar telemetría de azimut en el códice
            const deg = Math.round(((controls.getAzimuthalAngle() * 180 / Math.PI) + 360) % 360);
            telemetryAngle.textContent = `AZIMUT: ${String(deg).padStart(3, '0')}°`;

            composer.render();
        }

        animate(0);
    </script>
</body>
</html>
